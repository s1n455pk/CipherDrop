<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#08111f">
  <title>{% block title %}CipherDrop{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <div class="ambient ambient-one"></div><div class="ambient ambient-two"></div>
  <header class="topbar">
    <a class="brand" href="/"><span class="brand-mark">C</span><span>Cipher<span class="brand-accent">Drop</span></span></a>
    <nav>
      <a href="/">Home</a><a href="/send">Send file</a><a href="/receive">Receive</a><a href="/blockchain">Explorer</a>
    </nav>
    <a class="top-cta" href="/send">Start transfer <span>↗</span></a>
  </header>
  <main>{% block content %}{% endblock %}</main>
  <footer><span class="footer-brand">CipherDrop</span><span>Encrypted in your browser · Verified with SHA-256 · Recorded on a hash-linked ledger</span></footer>
  <script src="{{ url_for('static', filename='js/app.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
